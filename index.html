<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş - BEATFORGE</title>
    <link rel="stylesheet" href="style.css">
    <!-- REST API Database Layer -->
    <script src="db.js"></script>
    <script src="auth.js" defer></script>
</head>

<body class="auth-page">

    <div class="bg-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <div class="auth-container">
        <h1 class="glitch" style="font-size: 4rem; display: inline-block; margin-bottom: 10px;" data-text="BEATFORGE">BEATFORGE</h1>
        <p class="subtitle" style="margin-bottom: 30px;">Kendi ritmini ve müziğini yarat!</p>

        <!-- Login Form -->
        <div id="loginBox" class="form-box">
            <h2>Giriş Yap</h2>
            <div id="loginError" class="error-msg" style="display:none;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="loginUsername" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="loginPassword" required>
                </div>
                <button type="submit" class="btn-primary w-100">Giriş Yap</button>
                <p class="toggle-text"><a href="#" onclick="showForgotPassword(); return false;">Şifremi Unuttum / Sıfırla</a></p>
                <p class="toggle-text">Hesabın yok mu? <a href="#" onclick="toggleForms(); return false;">Kayıt Ol</a></p>
            </form>


        </div>

        <!-- Register Form -->
        <div id="registerBox" class="form-box" style="display:none;">
            <h2>Kayıt Ol</h2>
            <div id="regError" class="error-msg" style="display:none;"></div>
            <form id="registerForm">
                <div class="form-group">
                    <label>E-posta Adresi</label>
                    <input type="email" id="regEmail" required placeholder="ornek@domain.com">
                </div>
                <div class="form-group">
                    <label>Kullanıcı Adı</label>
                    <input type="text" id="regUsername" required>
                </div>
                <div class="form-group">
                    <label>Şifre</label>
                    <input type="password" id="regPassword" required>
                </div>
                <div class="form-group">
                    <label>Şifre (Tekrar)</label>
                    <input type="password" id="regPasswordConfirm" required>
                </div>
                <button type="submit" class="btn-primary w-100">Kayıt Ol</button>
                <p class="toggle-text">Zaten hesabın var mı? <a href="#" onclick="toggleForms(); return false;">Giriş
                        Yap</a></p>
            </form>
        </div>

        <!-- Forgot Password Form -->
        <div id="forgotBox" class="form-box" style="display:none;">
            <h2>Şifremi Sıfırla</h2>
            <p style="font-size:0.9rem; color:var(--text-secondary); margin-bottom:15px;">Kayıtlı e-posta adresinizi ve yeni şifrenizi girerek şifrenizi güncelleyin.</p>
            <div id="forgotError" class="error-msg" style="display:none;"></div>
            <form id="forgotForm">
                <div class="form-group">
                    <label>E-posta Adresi</label>
                    <input type="email" id="forgotEmail" required placeholder="ornek@domain.com">
                </div>
                <div class="form-group">
                    <label>Yeni Şifre</label>
                    <input type="password" id="forgotNewPassword" required>
                </div>
                <div class="form-group">
                    <label>Yeni Şifre (Tekrar)</label>
                    <input type="password" id="forgotNewPasswordConfirm" required>
                </div>
                <button type="submit" class="btn-primary w-100">Şifreyi Güncelle</button>
                <p class="toggle-text"><a href="#" onclick="cancelForgot(); return false;">Giriş Ekranına Dön</a></p>
            </form>
        </div>
    </div>
</body>

</html>
